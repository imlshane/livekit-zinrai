<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Stream</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0e0e0e; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, sans-serif; color: #fff; }
  .player-wrap { position: relative; width: 100%; max-width: 1280px; }
  video { width: 100%; aspect-ratio: 16/9; background: #000; display: block; }
  #status { margin-top: 10px; font-size: 13px; color: #888; text-align: center; }
  #error  { margin-top: 8px; font-size: 12px; color: #e55; text-align: center; display: none; }
  #unmute-overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.6); cursor: pointer; gap: 12px;
  }
  #unmute-overlay svg { width: 56px; height: 56px; fill: #fff; opacity: 0.9; }
  #unmute-overlay span { font-size: 15px; color: #fff; opacity: 0.85; }
  #unmute-overlay.hidden { display: none; }
  #subtitle-bar {
    position: absolute; bottom: 48px; left: 50%; transform: translateX(-50%);
    max-width: 85%; background: rgba(0,0,0,0.78); color: #fff;
    font-size: 17px; line-height: 1.45; padding: 5px 14px;
    border-radius: 4px; text-align: center; pointer-events: none;
    display: none; transition: opacity 0.35s;
  }
  #cc-btn {
    position: absolute; bottom: 10px; right: 10px;
    background: rgba(0,0,0,0.55); color: #fff;
    border: 1px solid rgba(255,255,255,0.35); border-radius: 4px;
    padding: 3px 8px; font-size: 12px; cursor: pointer; z-index: 10;
    user-select: none;
  }
  #cc-btn.cc-off { opacity: 0.45; text-decoration: line-through; }
</style>
</head>
<body>
<div class="player-wrap">
  <video id="video" autoplay playsinline muted></video>
  <div id="subtitle-bar"></div>
  <button id="cc-btn" title="Toggle subtitles">CC</button>
  <div id="unmute-overlay" class="hidden">
    <!-- Speaker icon -->
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
    </svg>
    <span>Click to enable audio</span>
  </div>
</div>
<div id="status">Connecting...</div>
<div id="error"></div>

<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  var token  = params.get('token');

  // Stable per-tab session ID — persists across WebRTC reconnects within the same tab
  // but is brand-new for every new tab, blocking URL sharing
  var sid = sessionStorage.getItem('zs_sid');
  if (!sid) {
    sid = ([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g, c =>
      (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16));
    sessionStorage.setItem('zs_sid', sid);
  }
  var statusEl  = document.getElementById('status');
  var errorEl   = document.getElementById('error');
  var video     = document.getElementById('video');

  function setStatus(msg) { statusEl.textContent = msg; }
  function setError(msg)  { errorEl.textContent = msg; errorEl.style.display = msg ? 'block' : 'none'; }

  if (!token) {
    setStatus('No token specified.');
    setError('Add ?token=YOUR_TOKEN to the URL.');
    return;
  }

  if (!window.RTCPeerConnection) {
    setStatus('WebRTC not supported in this browser.');
    return;
  }

  var overlay     = document.getElementById('unmute-overlay');
  var pc          = null;
  var retryCount  = 0;
  var retryTimer  = null;
  var MAX_RETRY   = 30;
  var connected   = false;

  // Click overlay → resume audio context first, then unmute
  // Without resuming AudioContext, unmuting causes a ~0.5s dropout
  overlay.addEventListener('click', function () {
    var ctx = window.AudioContext || window.webkitAudioContext;
    if (ctx) {
      var ac = new ctx();
      ac.resume().then(function () { ac.close(); });
    }
    video.muted = false;
    overlay.classList.add('hidden');
  });

  // Proxy endpoint — stream_key never exposed to browser
  function playApiUrl() {
    return '/api/play';
  }

  function scheduleRetry(delaySec) {
    if (retryTimer) return;
    if (retryCount >= MAX_RETRY) {
      setStatus('Stream unavailable. Refresh the page to try again.');
      return;
    }
    var delay = delaySec || Math.min(2000 * Math.pow(1.5, retryCount), 20000);
    retryCount++;
    setStatus('Waiting for stream... (' + retryCount + '/' + MAX_RETRY + ')');
    retryTimer = setTimeout(function () { retryTimer = null; connect(); }, delay);
  }

  function cleanup() {
    if (pc) {
      pc.oniceconnectionstatechange = null;
      pc.ontrack = null;
      try { pc.close(); } catch (_) {}
      pc = null;
    }
    video.srcObject = null;
    connected = false;
  }

  async function connect() {
    cleanup();

    pc = new RTCPeerConnection({
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        {
          urls:       ['turn:turn.zinrai.live:3478', 'turns:turn.zinrai.live:5349'],
          username:   'streaming',
          credential: 'jsiWjs2302scourt',
        },
      ],
      bundlePolicy:       'max-bundle',
      iceTransportPolicy: 'all',
    });

    pc.addTransceiver('video', { direction: 'recvonly' });
    pc.addTransceiver('audio', { direction: 'recvonly' });

    pc.ontrack = function (e) {
      if (e.streams && e.streams[0]) {
        video.srcObject = e.streams[0];
        // Start muted (browser autoplay policy) then show overlay for unmute
        video.muted = true;
        video.play().then(function () {
          overlay.classList.remove('hidden');
        }).catch(function () {
          overlay.classList.remove('hidden');
        });
      }
    };

    pc.oniceconnectionstatechange = function () {
      var state = pc ? pc.iceConnectionState : 'closed';
      if (state === 'connected' || state === 'completed') {
        connected = true;
        retryCount = 0;
        setStatus('LIVE — WebRTC');
        setError('');
      } else if (state === 'disconnected') {
        setStatus('Connection dropped — reconnecting...');
        scheduleRetry(3000);
      } else if (state === 'failed' || state === 'closed') {
        setStatus('Connection failed — retrying...');
        scheduleRetry();
      }
    };

    var offer;
    try {
      offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
    } catch (e) {
      setStatus('Failed to create offer.');
      setError(e.message);
      scheduleRetry();
      return;
    }

    // POST SDP offer to auth proxy — stream_key resolved server-side
    var result;
    try {
      var resp = await fetch(playApiUrl(), {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ sdp: offer.sdp, token: token, sid: sid }),
      });
      if (resp.status === 401 || resp.status === 403) {
        setStatus('Access denied.');
        setError('Token invalid or expired. Get a new link from the host.');
        return;  // do NOT retry on auth failure
      }
      if (resp.status === 404) {
        scheduleRetry();
        return;
      }
      result = await resp.json();
    } catch (e) {
      scheduleRetry();
      return;
    }

    try {
      await pc.setRemoteDescription({ type: 'answer', sdp: result.sdp });
    } catch (e) {
      setStatus('SDP negotiation failed.');
      setError(e.message);
      scheduleRetry();
    }
  }

  // Reconnect when tab becomes visible again
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && !connected && !retryTimer) {
      retryCount = 0;
      connect();
    }
  });

  connect();

  // ── Subtitles ──────────────────────────────────────────────────────────────
  var subtitleEl   = document.getElementById('subtitle-bar');
  var ccBtn        = document.getElementById('cc-btn');
  var ccEnabled    = true;
  var hideTimer    = null;
  var evtSource    = null;

  function showSubtitle(text) {
    if (!ccEnabled || !text) return;
    subtitleEl.textContent = text;
    subtitleEl.style.display = 'block';
    subtitleEl.style.opacity = '1';
    clearTimeout(hideTimer);
    hideTimer = setTimeout(function () {
      subtitleEl.style.opacity = '0';
      setTimeout(function () { subtitleEl.style.display = 'none'; }, 350);
    }, 4000);
  }

  ccBtn.addEventListener('click', function () {
    ccEnabled = !ccEnabled;
    ccBtn.classList.toggle('cc-off', !ccEnabled);
    if (!ccEnabled) {
      clearTimeout(hideTimer);
      subtitleEl.style.display = 'none';
    }
  });

  function connectSubtitles() {
    if (evtSource) { evtSource.close(); evtSource = null; }
    evtSource = new EventSource('/api/subtitles?token=' + encodeURIComponent(token));

    evtSource.onmessage = function (e) {
      try {
        var d = JSON.parse(e.data);
        if (d.text) showSubtitle(d.text);
      } catch (_) {}
    };

    evtSource.addEventListener('end', function () {
      evtSource.close(); evtSource = null;
    });

    // SSE reconnects automatically on error — no manual retry needed
  }

  connectSubtitles();
})();
</script>
</body>
</html>
