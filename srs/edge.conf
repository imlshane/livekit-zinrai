listen              1935;
max_connections     10000;
daemon              off;
srs_log_tank        console;
srs_log_level       warn;

# WebRTC server — serves viewer SRTP locally (origin handles ingest only)
rtc_server {
    enabled     on;
    listen      8000;
    candidate   $CANDIDATE;    # set CANDIDATE=<edge-public-ip> in .env
    tcp {
        enabled  off;
    }
}

http_api {
    enabled     on;
    listen      1985;
    crossdomain on;
}

http_server {
    enabled     on;
    listen      8080;
    dir         ./objs/nginx;
    crossdomain on;
}

stats {
    network     0;
}

vhost __defaultVhost__ {

    # Pull stream from origin on first viewer connect — auto fan-out
    cluster {
        mode    remote;
        origin  $ORIGIN_PRIVATE_IP:1935;
    }

    # WebRTC per-vhost — serve viewer playback from this edge
    rtc {
        enabled         on;
        rtmp_to_rtc     on;
        nack            on;
        twcc            on;
    }

    # HTTP-FLV — low latency fallback for non-WebRTC viewers
    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
        hstrs       on;
    }

    # No HLS, no DVR on edge — recordings stay on origin only

    # Callbacks — route through origin Caddy so auth is reachable without VPC
    http_hooks {
        enabled         on;
        on_play         https://$SRS_PUBLIC_HOST/api/on_play;
        on_stop         https://$SRS_PUBLIC_HOST/api/on_stop;
        # on_publish / on_unpublish / on_dvr handled by origin only
    }
}
