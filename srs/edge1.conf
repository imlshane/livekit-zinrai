listen              1935;
max_connections     10000;
daemon              off;
srs_log_tank        console;
srs_log_level       warn;

# Edge1 — independent origin, receives RTMP forward from srs-origin
# Serves WebRTC on port 8001 (distinct from origin port 8000)
rtc_server {
    enabled     on;
    listen      8001;
    candidate   $CANDIDATE;
    tcp {
        enabled  off;
    }
}

http_api {
    enabled     on;
    listen      1985;
    crossdomain on;
}

http_server {
    enabled     on;
    listen      8080;
    dir         ./objs/nginx;
    crossdomain on;
}

stats {
    network     0;
}

vhost __defaultVhost__ {

    rtc {
        enabled         on;
        rtmp_to_rtc     on;
        nack            on;
        twcc            on;
    }

    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
        hstrs       on;
    }

    # No HLS, no DVR on edges — recordings handled by origin only
    http_hooks {
        enabled         on;
        on_play         http://172.20.0.2:8000/on_play;
        on_stop         http://172.20.0.2:8000/on_stop;
    }
}
