listen              1935;
max_connections     10000;
daemon              off;
srs_log_tank        console;
srs_log_level       warn;

rtc_server {
    enabled     on;
    listen      8001;              # distinct UDP port — browser connects server-ip:8001
    candidate   $CANDIDATE;
    tcp {
        enabled  off;
    }
}

http_api {
    enabled     on;
    listen      1985;
    crossdomain on;
}

http_server {
    enabled     on;
    listen      8080;
    dir         ./objs/nginx;
    crossdomain on;
}

stats {
    network     0;
}

vhost __defaultVhost__ {

    cluster {
        mode    remote;
        origin  srs:1935;
    }

    rtc {
        enabled         on;
        rtmp_to_rtc     on;
        nack            on;
        twcc            on;
    }

    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
        hstrs       on;
    }

    http_hooks {
        enabled         on;
        on_play         http://172.20.0.2:8000/on_play;
        on_stop         http://172.20.0.2:8000/on_stop;
    }
}
